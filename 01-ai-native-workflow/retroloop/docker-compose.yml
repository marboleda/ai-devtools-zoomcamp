services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: retroloop
      POSTGRES_USER: retroloop
      POSTGRES_PASSWORD: retroloop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retroloop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
