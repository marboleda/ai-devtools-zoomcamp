{% if records %}
<ul>
  {% for record in records %}
  <li>
    {{ record.get_kind_display }} — {{ record.get_processing_state_display }}
    {% if record.error %}
    <br><small>Error: {{ record.error }}</small>
    {% endif %}
  </li>
  {% endfor %}
</ul>
{% else %}
<p>No meeting record uploaded yet.</p>
{% endif %}
